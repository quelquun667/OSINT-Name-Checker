name: Verify site detection

on:
  schedule:
    # Every Monday at 06:00 UTC — independent of pushes, so the list gets
    # checked even during quiet periods.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run site verification
        id: verify
        continue-on-error: true
        run: python verify_sites.py

      - name: Read report
        id: report
        if: always()
        run: |
          if [ -f sites_verification_report.json ]; then
            {
              echo 'json<<EOF'
              cat sites_verification_report.json
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update issue if something is broken
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(`${{ steps.report.outputs.json }}`);
            const title = "Weekly site verification failed";
            const body = [
              `Automated weekly check found **${report.broken.length}** broken site(s) in \`sites.json\`.`,
              "",
              "| Site | Fake username result | Real username | Real username result |",
              "|---|---|---|---|",
              ...report.broken.map(b =>
                `| ${b.name} | ${b.fake_username_result} | ${b.real_username || "-"} | ${b.real_username_result ?? "-"} |`
              ),
              "",
              "See the \"Site detection issue\" template / README's \"Adding a new site\" section for how to fix an entry.",
              "",
              `_Generated by the \`verify-sites\` workflow, run #${context.runNumber}._`,
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "site-detection,automated",
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["site-detection", "automated"],
              });
            }

      - name: Close stale issue if everything passes now
        if: steps.verify.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly site verification failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "site-detection,automated",
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "All sites passed verification again — closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
